schema_version: 1
suite: rag-benchmark-76
seed: 0
evaluation_conditions:
  dataset: Use the same fixed evaluation corpus and query set for every family.
  prompts: Use the selected registered prompt unchanged across comparisons.
  stochasticity: Record model/provider stochasticity separately from deterministic
    pipeline metrics.
experiments:
- id: BASE-01
  name: benchmark_base_01
  family: baselines
  status: supported
  ingestion_pipeline: config/pipelines/benchmarks/01_baselines/benchmark_ingest_minilm_recursive.yaml
  query_pipeline: config/pipelines/benchmarks/01_baselines/benchmark_base_01.yaml
  components:
    embedding: embedding_local_minilm
  baseline: BGE-M3 + recursive-token chunking + Qdrant + dense retrieval + identity
    reranker + noop assessor + always-accept
  hypothesis: MiniLM provides a lightweight quality/latency reference.
  required_models_and_services:
  - Registered local or configured remote model resources used by the selected components.
  - PostgreSQL for persisted chunks and FTS where required; Qdrant, pgvector, or FAISS
    according to the ingestion preset.
  expected_metrics:
  - recall@K
  - MRR
  - answer correctness
  - faithfulness
  - end-to-end latency
  compatibility_constraints:
  - Use the same dataset, seed, prompts, retrieval depth, context budget, and generation
    settings across the family.
