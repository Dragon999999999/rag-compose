schema_version: 1
name: basic_rag_fast_reasoning
version: 1
description: Grounded retrieval using the shorter-timeout catalog reasoning profile.
representation:
  parser:
    type: pymupdf
  knowledge_builder:
    type: basic
  chunker:
    type: fixed_window
    version: '1'
    target_chars: 800
    overlap_chars: 120
  embedding:
    model_ref: embedding_001
  vector_backend:
    type: qdrant
    index_version: '1'
query:
  retriever:
    type: vector
    top_k: 8
    context_chars: 12000
    summary_per_facet: 3
  reranker:
    type: identity
  reasoner:
    type: basic_grounded
    model_ref: reasoning_002
    prompt_id: grounded_qa_v1
  assessors:
    - type: source_reference
  decision_policy:
    type: basic_grounding
  renderer:
    type: grounded_answer
  chat_history:
    mode: recent_messages
    max_messages: 10
