schema_version: 1
kind: query
name: query_basic_v1
version: 1
description: Default query pipeline for indexed project documents.
is_default: true
query:
  retriever:
    type: vector
    top_k: 8
    context_chars: 12000
    summary_per_facet: 3
  reranker:
    type: identity
  reasoner:
    type: basic_grounded
    model_ref: reasoning_001
    prompt_id: grounded_qa_v1
  assessors:
    - type: source_reference
  decision_policy:
    type: basic_grounding
  renderer:
    type: grounded_answer
  chat_history:
    mode: recent_messages
    max_messages: 10
