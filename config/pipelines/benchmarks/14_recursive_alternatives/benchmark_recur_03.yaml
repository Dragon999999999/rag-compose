schema_version: 2
kind: query
name: benchmark_recur_03
version: 1
description: Generated RAG benchmark query pipeline.
query:
  retriever: retriever_dense_vector_default
  reranker: reranker_identity
  reasoner: reasoner_basic_grounded
  assessors:
  - assessor_evidence_sufficiency
  decision_policy: decision_basic_grounding
  renderer: renderer_grounded_answer
  chat_history:
    mode: recent_messages
    max_messages: 10
  execution:
    max_attempts: 2
    max_stage_calls: 100
    evidence_merge: replace
    final_failure_policy: last_result
    alternatives:
    - id: primary
      acceptance:
        strategy: evidence_sufficiency
      decision_policy:
        type: decision_policy
        implementation: basic_grounding
      stage_overrides:
        assessors:
        - type: assessor
          implementation: relevance
    - id: retry
      acceptance:
        strategy: always_accept
      decision_policy:
        type: decision_policy
        implementation: basic_grounding
      source:
        alternative_id: primary
        path_id: primary
        restart_stage: retriever
      stage_overrides:
        retriever:
          type: hybrid
          implementation: hybrid_rrf
          top_k: 10
          dense_top_k: 20
          sparse_top_k: 20
          rrf_k: 60
          query_embedder: null
        assessors:
        - type: assessor
          implementation: evidence_sufficiency
