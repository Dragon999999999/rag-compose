schema_version: 2
kind: query
name: benchmark_recur_01
version: 1
description: Generated RAG benchmark query pipeline.
query:
  retriever: retriever_dense_vector_default
  reranker: reranker_identity
  reasoner: reasoner_basic_grounded
  assessors:
  - assessor_evidence_sufficiency
  - assessor_source_reference
  decision_policy: decision_basic_grounding
  renderer: renderer_grounded_answer
  chat_history:
    mode: recent_messages
    max_messages: 10
  execution:
    max_attempts: 2
    max_stage_calls: 100
    evidence_merge: replace
    final_failure_policy: best_result
    alternatives:
    - id: primary
    - id: retry
      source:
        alternative_id: primary
        path_id: primary
        restart_stage: assessor
      stage_overrides:
        assessors:
        - type: assessor
          implementation: retrieval_confidence
