schema_version: 2
kind: query
name: test_3
version: 1
description: Dense and BM25 retrieval branches joined by the registered merge policy.
query:
  retriever: retriever_dense_vector_default
  reranker: reranker_bge_v2_m3
  reasoner: reasoner_basic_grounded
  assessors:
    - assessor_evidence_sufficiency
    - assessor_diversity
    - assessor_relevance
  decision_policy: decision_merge_branches
  renderer: renderer_grounded_answer
  chat_history:
    mode: recent_messages
    max_messages: 10
  execution:
    max_attempts: 1
    max_stage_calls: 100
    evidence_merge: union
    final_failure_policy: best_result
    alternatives:
      - id: retrieval_branches
        branches:
          - id: dense
            start_at: retriever
            retriever: vector_similarity
            reranker: cross_encoder
            assessors:
              - evidence_sufficiency
              - diversity
              - relevance
          - id: sparse
            start_at: retriever
            retriever: bm25
            reranker: cross_encoder
            assessors:
              - evidence_sufficiency
              - diversity
              - relevance
