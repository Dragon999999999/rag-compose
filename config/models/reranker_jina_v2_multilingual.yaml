id: reranker_jina_v2_multilingual
stage: reranker
location: local
backend: sentence_transformers
name: jinaai/jina-reranker-v2-base-multilingual
source:
  type: huggingface
  repository: jinaai/jina-reranker-v2-base-multilingual
storage:
  relative_path: reranker/jina_reranker_v2_multilingual
runtime:
  type: in_process
  device: cuda
  idle_timeout_seconds: 600
  memory_limit: 4g
parameters:
  reranker_type: cross_encoder
  batch_size: 2
  max_length: 512
  trust_remote_code: true
