id: embedding_bge_m3
stage: embedding
location: local
backend: sentence_transformers
name: BAAI/bge-m3
source:
  type: huggingface
  repository: BAAI/bge-m3
storage:
  relative_path: embedding/bge-m3
runtime:
  type: docker
  image: ghcr.io/huggingface/text-embeddings-inference:1.8
  command: ["--model-id", "/models/model"]
  container_path: /models/model
  port: 8000
  readiness_path: /health
  device: cpu
  idle_timeout_seconds: 600
  memory_limit: 6g
parameters:
  dimension: 1024
  normalize: true
  batch_size: 2
