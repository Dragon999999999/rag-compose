id: embedding_gemma_300m
stage: embedding
location: local
backend: sentence_transformers
name: google/embeddinggemma-300m
source:
  type: huggingface
  repository: google/embeddinggemma-300m
storage:
  relative_path: embedding/embeddinggemma-300m
runtime:
  type: docker
  image: ghcr.io/huggingface/text-embeddings-inference:1.8
  command: ["--model-id", "/models/model"]
  container_path: /models/model
  port: 8000
  readiness_path: /health
  device: cpu
  idle_timeout_seconds: 600
  memory_limit: 6g
parameters:
  dimension: 768
  normalize: true
  batch_size: 4
  query_prefix: 'task: search result | query: '
  document_prefix: 'title: none | text: '
