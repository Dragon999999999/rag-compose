id: embedding_splade_v3
stage: embedding
location: local
backend: sentence_transformers
name: naver/splade-v3
source:
  type: huggingface
  repository: naver/splade-v3
storage:
  relative_path: embedding/splade-v3
runtime:
  type: in_process
  device: cpu
  idle_timeout_seconds: 600
  memory_limit: 6g
parameters:
  representation: sparse
  dimension: 30522
  normalize: false
  similarity_metric: dot
  batch_size: 1
  sparse_endpoint: /v1/sparse_embeddings
  trust_remote_code: true
