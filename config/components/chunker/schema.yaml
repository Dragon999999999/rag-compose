$schema: https://json-schema.org/draft/2020-12/schema
title: Chunker component
unevaluatedProperties: false
allOf:
  - $ref: ../schema.yaml
  - type: object
    properties:
      type: {const: chunker}
      implementation:
        {enum: [block_aware, fixed_window, recursive_token, hierarchical, structural, sentence_window, semantic, llm_guided, late_chunking]}
      config:
        type: object
        additionalProperties: false
        properties:
          version: {type: string, default: '1', x-override-scopes: []}
          target_chars:
            type: integer
            minimum: 32
            maximum: 100000
            default: 800
            x-override-scopes: [pipeline]
          overlap_chars:
            type: integer
            minimum: 0
            default: 120
            x-override-scopes: [pipeline]
          target_tokens:
            type: integer
            minimum: 1
            maximum: 100000
            default: 256
            x-override-scopes: [pipeline]
          max_tokens:
            type: [integer, 'null']
            minimum: 1
            maximum: 100000
            x-override-scopes: [pipeline]
          overlap_tokens:
            type: integer
            minimum: 0
            maximum: 100000
            default: 32
            x-override-scopes: [pipeline]
          tokenizer:
            type: string
            enum: [whitespace, unicode_words]
            default: unicode_words
            x-override-scopes: [pipeline]
          hierarchical_levels:
            type: array
            minItems: 1
            items:
              type: integer
              minimum: 1
            default: [2048, 512, 128]
            x-override-scopes: [pipeline]
          sentences_per_chunk:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
            x-override-scopes: [pipeline]
          sentence_window:
            type: integer
            minimum: 0
            maximum: 100
            default: 2
            x-override-scopes: [pipeline]
          model_id:
            type: string
            minLength: 1
            x-override-scopes: []
          semantic_threshold:
            type: number
            minimum: 0
            maximum: 2
            default: 0.25
            x-override-scopes: [pipeline]
          semantic_percentile:
            type: [number, 'null']
            minimum: 0
            maximum: 100
            x-override-scopes: [pipeline]
          minimum_chunk_tokens:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
            x-override-scopes: [pipeline]
          llm_max_new_tokens:
            type: integer
            minimum: 1
            maximum: 4096
            default: 256
            x-override-scopes: [pipeline]
